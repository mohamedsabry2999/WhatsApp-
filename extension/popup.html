<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ContactHarvest</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(fonts/cairo-arabic-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Cairo; font-weight: 700; src: url(fonts/cairo-arabic-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format("woff2"); }

  /* هوية محمد صبري: أحمر على أسود */
  :root {
    --brand: #E10600;
    --black: #111111;
    --panel: #1B1B1B;
    --line: #2A2A2A;
    --white: #FFFFFF;
    --muted: #9A9A9A;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; background: var(--black); color: var(--white);
    font-family: Inter, Cairo, system-ui, sans-serif; font-size: 13px;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 3px solid var(--brand); }
  header img { width: 40px; height: 40px; }
  .brand { text-align: right; font-family: Inter, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -.2px; line-height: 1.1; }
  .brand span { color: var(--brand); }
  .tag { color: var(--muted); font-size: 12px; margin-top: 3px; }

  main { padding: 16px 18px 6px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; }
  .group-title { color: var(--muted); font-size: 11px; font-weight: 700; margin: 4px 0 2px; }
  label { display: flex; gap: 10px; align-items: center; padding: 7px 0; cursor: pointer; }
  input { accent-color: var(--brand); width: 15px; height: 15px; margin: 0; }

  button {
    width: 100%; margin-top: 6px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--brand); color: var(--white); font: 700 14px Cairo, sans-serif; cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:disabled { background: #5a1a18; color: #c9a9a7; cursor: wait; }

  #status { margin-top: 12px; line-height: 1.7; white-space: pre-line; min-height: 1px; }
  #status.ok { color: var(--white); border-right: 3px solid var(--brand); padding-right: 10px; }
  #status.err { color: #FFB3AE; border-right: 3px solid #FFB3AE; padding-right: 10px; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding: 10px 18px 14px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }
  footer .sig { color: var(--white); }
  footer .sig b { color: var(--brand); font-weight: 700; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="">
    <div>
      <div class="brand" dir="ltr">Contact<span>Harvest</span></div>
      <div class="tag">كل الأرقام اللي اتراسلت معاها في شيت واحد</div>
    </div>
  </header>

  <main>
    <div class="group">
      <div class="group-title">البيانات</div>
      <label><input type="checkbox" id="includeAll"> ضيف كمان كل جهات الاتصال المحفوظة</label>
    </div>
    <div class="group">
      <div class="group-title">نوع الملف</div>
      <label><input type="radio" name="fmt" value="xlsx" checked> Excel (.xlsx)</label>
      <label><input type="radio" name="fmt" value="csv"> CSV</label>
    </div>
    <button id="go">استخراج وتحميل الشيت</button>
    <div id="status"></div>
  </main>

  <footer>
    <div class="sig">تطوير: <b>محمد صبري</b> | <bdi dir="ltr">Mohamed Sabry</bdi></div>
    <div dir="ltr">v<span id="ver"></span></div>
  </footer>

  <script src="xlsx.js"></script>
  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
