<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketer's Toolkit — محمد صبري</title>
<link rel="icon" href="icons/icon48.png">
<link rel="stylesheet" href="lib/brand.css">
<style>
  body { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { background: #0B0B0B; border-left: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .logo { display: flex; gap: 10px; align-items: center; padding: 0 6px 16px; border-bottom: 3px solid var(--brand); margin-bottom: 12px; }
  .logo img { width: 34px; } .logo .brand-name { font-size: 16px; line-height: 1.15; }
  nav { display: grid; gap: 2px; }
  nav a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font: 13px Cairo, Inter, sans-serif; border-right: 3px solid transparent; }
  nav a:hover { background: var(--panel); }
  nav a.on { background: var(--panel); color: var(--white); border-right-color: var(--brand); font-weight: 700; }
  nav .grp { color: var(--muted); font-size: 11px; font-weight: 700; padding: 12px 10px 4px; }
  aside .sig { margin-top: auto; color: var(--muted); font-size: 11px; padding: 10px 6px 0; border-top: 1px solid var(--line); }
  aside .sig b { color: var(--brand); }
  main { padding: 28px 32px 60px; max-width: 1100px; width: 100%; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 22px; margin: 0; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  /* نسخة أداة واحدة: من غير قايمة جانبية */
  body.single { grid-template-columns: 1fr; }
  body.single aside { position: static; height: auto; flex-direction: row; align-items: center; justify-content: space-between; border-left: 0; border-bottom: 3px solid var(--brand); padding: 12px 32px; }
  body.single aside nav { display: none; }
  body.single .logo { border: 0; margin: 0; padding: 0; }
  body.single aside .sig { margin: 0; border: 0; padding: 0; text-align: left; }
  body.single main { margin: 0 auto; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; } main { padding: 18px 16px; } }
</style>
</head>
<body>
  <aside>
    <div class="logo">
      <img src="icons/icon.svg" alt="">
      <div class="brand-name" id="brand" dir="ltr" style="text-align:right">Marketer's<br><span>Toolkit</span></div>
    </div>
    <nav id="nav">
      <div class="grp">واتساب</div>
      <a href="#replies">الردود الجاهزة</a>
      <a href="#crm">CRM واتساب</a>
      <a href="#walink">لينك واتساب + QR</a>
      <div class="grp">المحتوى</div>
      <a href="#post">مراجع البوست</a>
      <a href="#ads">أرشيف الإعلانات</a>
      <a href="#notion">Notion</a>
      <div class="grp">التحليل</div>
      <a href="#utm">UTM Builder</a>
      <a href="#calc">حاسبة الحملات</a>
    </nav>
    <div class="sig">تطوير: <b>محمد صبري</b><br><bdi dir="ltr">Mohamed Sabry</bdi> · v<span id="ver"></span></div>
  </aside>
  <main id="main"></main>

  <script src="features.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="lib/xlsx.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/defaults.js"></script>
  <script src="tools/registry.js"></script>
  <script src="tools/replies.js"></script>
  <script src="tools/crm.js"></script>
  <script src="tools/walink.js"></script>
  <script src="tools/post.js"></script>
  <script src="tools/ads.js"></script>
  <script src="tools/notion.js"></script>
  <script src="tools/utm.js"></script>
  <script src="tools/calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
